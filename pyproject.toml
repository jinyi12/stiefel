[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stiefel"
version = "0.1.0"
description = "Riemannian geometry and statistics on the Stiefel manifold, written in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jin Yi Yong" }, { name = "Johann Guilleminot" }]
keywords = ["Stiefel manifold", "Riemannian geometry", "JAX", "reduced-order models"]
dependencies = ["jax>=0.7", "jaxtyping>=0.3"]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.7"]
# What Stiefel.to_pymanopt() and the cross-check tests against pymanopt need. geomstats 2.8 cannot be imported
# under numpy 2, so the comparison with it uses reference arrays (tools/geomstats_reference.py).
compat = ["pymanopt>=2.2"]

[dependency-groups]
dev = ["pytest>=8.2", "hypothesis>=6", "beartype>=0.19", "ruff>=0.9", "numpy>=2", "scipy>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/stiefel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
ignore = ["E741", "F722"]  # single-letter matrix names; jaxtyping shape strings
