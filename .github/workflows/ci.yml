name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  JAX_PLATFORMS: cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest
      - name: Example notebook
        run: uv run --with jupyterlab --with matplotlib --with nbmake pytest --nbmake examples/

  oldest-jax:
    # The lower bound jax>=0.7 in pyproject.toml; keep the two in step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.11
      - run: uv run --with "jax==0.7.0" --with "jaxlib==0.7.0" pytest
